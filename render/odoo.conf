; Odoo config for Render. DB connection and the master password come from env vars
; (see render/entrypoint.sh and render.yaml), never from this file.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Render terminates HTTPS in front of the service.
proxy_mode = True
list_db = False
; workers = 0 keeps HTTP and websocket on one port (Render routes a single port).
workers = 0
max_cron_threads = 1
limit_time_real = 600
log_level = info
log_handler = :INFO,werkzeug:WARNING
